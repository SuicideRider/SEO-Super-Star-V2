name: Daily SEO audit

# Audits the pages named in automation.json once a day and keeps the CSV as a
# downloadable artifact. Free on public repositories. It does nothing until
# automation.json names a sitemap or URLs.

on:
  schedule:
    - cron: "17 5 * * *"   # 05:17 UTC every day
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run daily audit
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
        run: python -m seo_super_star daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-audit-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
